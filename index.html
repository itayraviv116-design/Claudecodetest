<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוד ירוק — עוזר חנות פרחים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating petal background effect -->
    <canvas id="petalCanvas" class="petal-canvas"></canvas>

    <!-- Main terminal container -->
    <div class="terminal-container">
        <!-- Terminal header -->
        <div class="terminal-header">
            <div class="terminal-title">
                <span class="terminal-icon">✿</span>
                <span>סוד ירוק</span>
            </div>
            <div class="terminal-status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">לא מחובר</span>
            </div>
        </div>

        <!-- Configuration panel -->
        <div class="config-panel" id="configPanel">
            <div class="config-header">
                <span>⚙ הגדרות חיבור</span>
                <button class="config-toggle" id="configToggle">✕</button>
            </div>
            <div class="config-content">
                <label for="webhookUrl">כתובת Webhook של n8n:</label>
                <input
                    type="text"
                    id="webhookUrl"
                    placeholder="https://your-n8n-instance.com/webhook/chatbot"
                    autocomplete="off"
                >
                <div class="config-method">
                    <label for="httpMethod">שיטת בקשה:</label>
                    <select id="httpMethod" class="config-select">
                        <option value="GET" selected>GET (ברירת מחדל n8n)</option>
                        <option value="POST">POST</option>
                    </select>
                    <p class="config-hint-small">GET מוסיף ?message= לכתובת; POST שולח גוף JSON.</p>
                </div>
                <button id="saveConfig" class="config-save-btn">שמור הגדרות</button>
                <p class="config-hint">צריך עזרה? עיין ב-README.md להוראות הגדרת n8n.</p>
            </div>
        </div>

        <!-- Messages container -->
        <div class="terminal-body" id="terminalBody">
            <div class="message-container" id="messageContainer">
                <!-- Messages will be appended here -->
            </div>
        </div>

        <!-- Input area -->
        <div class="terminal-input">
            <span class="prompt">את/ה ~></span>
            <input
                type="text"
                id="messageInput"
                class="input-field"
                placeholder="שאל על פרחים, סידורים או טיפים לטיפול..."
                autocomplete="off"
                disabled
            >
            <button id="sendButton" class="send-btn" disabled>שלח ✿</button>
        </div>

        <!-- Footer controls (config + clear buttons) -->
        <div class="terminal-footer">
            <button id="configButton" class="footer-btn">⚙ הגדרות</button>
            <button id="clearButton" class="footer-btn">נקה</button>
            <span class="footer-info">לחץ ENTER לשליחה</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
