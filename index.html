<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal &amp; Bloom — Flower Shop Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating petal background effect -->
    <canvas id="petalCanvas" class="petal-canvas"></canvas>

    <!-- Main terminal container -->
    <div class="terminal-container">
        <!-- Terminal header -->
        <div class="terminal-header">
            <div class="terminal-title">
                <span class="terminal-icon">✿</span>
                <span>Petal &amp; Bloom</span>
            </div>
            <div class="terminal-status">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="statusText">OFFLINE</span>
            </div>
        </div>

        <!-- Configuration panel -->
        <div class="config-panel" id="configPanel">
            <div class="config-header">
                <span>⚙ Connection Settings</span>
                <button class="config-toggle" id="configToggle">✕</button>
            </div>
            <div class="config-content">
                <label for="webhookUrl">n8n Webhook URL:</label>
                <input
                    type="text"
                    id="webhookUrl"
                    placeholder="https://your-n8n-instance.com/webhook/chatbot"
                    autocomplete="off"
                >
                <div class="config-method">
                    <label for="httpMethod">Request Method:</label>
                    <select id="httpMethod" class="config-select">
                        <option value="GET" selected>GET (n8n default)</option>
                        <option value="POST">POST</option>
                    </select>
                    <p class="config-hint-small">GET appends ?message= to the URL; POST sends a JSON body.</p>
                </div>
                <button id="saveConfig" class="config-save-btn">Save Settings</button>
                <p class="config-hint">Need help? Check README.md for n8n setup instructions.</p>
            </div>
        </div>

        <!-- Messages container -->
        <div class="terminal-body" id="terminalBody">
            <div class="message-container" id="messageContainer">
                <!-- Messages will be appended here -->
            </div>
        </div>

        <!-- Input area -->
        <div class="terminal-input">
            <span class="prompt">you ~&gt;</span>
            <input
                type="text"
                id="messageInput"
                class="input-field"
                placeholder="Ask about flowers, arrangements, or care tips..."
                autocomplete="off"
                disabled
            >
            <button id="sendButton" class="send-btn" disabled>Send ✿</button>
        </div>

        <!-- Footer controls (config + clear buttons) -->
        <div class="terminal-footer">
            <button id="configButton" class="footer-btn">⚙ Settings</button>
            <button id="clearButton" class="footer-btn">Clear</button>
            <span class="footer-info">Press ENTER to send</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
